<!DOCTYPE html>
<html lang="ja">

<head>
    <title>Favorite</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="bmstable" content="header.json" />

    <script src="https://code.jquery.com/jquery-2.2.4.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTFAsrekwKmP1"
        crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ygbV6q5eNQ00vy+4msXn9868pTtWMgiQaeYH7/t7LECLbyPA2x65Kgf80OJFdroafW"
        crossorigin="anonymous">
    </script>
</head>

<body>

    <header class="mb-3">
        <nav class="navbar navbar-dark bg-dark">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 h1">favorite</span>
            </div>
        </nav>
    </header>

    <div class="container">

        <div class="alert alert-success mb-3" role="alert">
            <p>お気に入りの曲と譜面。次期難易度表フォーマット対応。</p>
            <p>難易度表の読み込みと表示に数秒かかります。</p>
            <hr>
            <p class="mb-0">説明文</p>
        </div>

        <!-- ここから難易度表本体 -->
        <div>
            <table class="table table-light table-striped table-hover" id="table_int">
            </table>
        </div>

        <script type="text/javascript">

            $(document).ready(function () {

                // header.jsonを読み込む
                $.getJSON($("meta[name=bmstable]").attr("content"), function (header) {

                    // data_urlから譜面データを読み込む
                    $.getJSON(header.data_url, function (information) {

                        // level_orderを使って表を作成
                        makeBMSTable(
                            information,
                            header.symbol,
                            header.level_order
                        );

                    });

                });

            });


            function makeBMSTable(info, mark, levelOrder) {

                var obj = $("#table_int");

                obj.html("");


                /*
                 * level_orderを使って並び順を作る
                 *
                 * 例：
                 * "-0" → 0
                 * "-1" → 1
                 * "-2" → 2
                 * ...
                 * "6"  → 18
                 * "sub" → 20
                 */

                var levelIndex = {};

                if (Array.isArray(levelOrder)) {

                    for (var i = 0; i < levelOrder.length; i++) {
                        levelIndex[String(levelOrder[i])] = i;
                    }

                }


                /*
                 * level_orderに従って譜面データを並び替える
                 *
                 * level_orderに存在しないレベルは
                 * 最後に配置する
                 *
                 * 同じレベルの場合は元の順番を維持する
                 */

                if (Array.isArray(levelOrder)) {

                    info.sort(function (a, b) {

                        var levelA = String(a.level);
                        var levelB = String(b.level);

                        var indexA = levelIndex.hasOwnProperty(levelA)
                            ? levelIndex[levelA]
                            : Number.MAX_SAFE_INTEGER;

                        var indexB = levelIndex.hasOwnProperty(levelB)
                            ? levelIndex[levelB]
                            : Number.MAX_SAFE_INTEGER;

                        return indexA - indexB;

                    });

                }


                /*
                 * テーブルのヘッダー
                 */

                $("<thead class='table-dark'>" +
                    "<tr>" +
                    "<th>Level</th>" +
                    "<th>Title</th>" +
                    "<th>Artist</th>" +
                    "<th>Comment</th>" +
                    "</tr>" +
                    "</thead>" +
                    "<tbody>")
                    .appendTo(obj);


                var x = "";
                var count = 0;
                var obj_sep = null;


                /*
                 * 譜面を表示
                 */

                for (var i = 0; i < info.length; i++) {

                    var currentLevel = String(info[i].level);


                    /*
                     * レベルが変わった場合
                     * レベル見出しを作成
                     */

                    if (x !== currentLevel) {

                        // 前のレベルの見出しを完成させる
                        if (obj_sep !== null) {

                            obj_sep.html(
                                "<td colspan='4'>" +
                                "<b>" +
                                mark + x +
                                " (" + count + "譜面)" +
                                "</b>" +
                                "</td>"
                            );

                        }


                        // 新しいレベルの見出しを作成
                        obj_sep = $(
                            "<tr class='table-dark' " +
                            "style='text-align:center' " +
                            "id='" + mark + currentLevel + "'>" +
                            "</tr>"
                        );

                        obj_sep.appendTo(obj);

                        count = 0;
                        x = currentLevel;

                    }


                    /*
                     * 通常の譜面行
                     */

                    var str = $("<tr></tr>");


                    // Level
                    $("<td width='5%'>" +
                        mark + currentLevel +
                        "</td>")
                        .appendTo(str);


                    // Title
                    $("<td width='45%'>" +
                        "<a href='https://bms-ir.org/new/song?songmd5=" +
                        info[i].md5 +
                        "' target='_blank'>" +
                        info[i].title +
                        "</a>" +
                        "</td>")
                        .appendTo(str);


                    // Artist
                    $("<td width='40%'>" +
                        info[i].artist +
                        "</td>")
                        .appendTo(str);


                    // Comment
                    $("<td width='10%'>" +
                        info[i].comment +
                        "</td>")
                        .appendTo(str);


                    str.appendTo(obj);

                    count++;

                }


                /*
                 * 最後のレベルの見出しを完成させる
                 */

                if (obj_sep !== null) {

                    obj_sep.html(
                        "<td class='table-dark' " +
                        "style='text-align:center' " +
                        "colspan='4'>" +
                        "<b>" +
                        mark + x +
                        " (" + count + "譜面)" +
                        "</b>" +
                        "</td>"
                    );

                }


                /*
                 * tbodyを閉じる
                 */

                $("</tbody>").appendTo(obj);

            }

        </script>

    </div>

</body>

</html>
